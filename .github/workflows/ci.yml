name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint and tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # the tests download a MongoDB binary; keep it between runs
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm test

  frontend:
    name: Frontend (lint, tests and build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    name: Docker Compose runs the whole app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Start the database, API and web app
        run: docker compose up --build --detach --wait

      - name: Check the web app, and the API through it
        run: |
          curl --fail --silent --show-error http://localhost:8080/ | grep -q '<div id="root">'
          curl --fail --silent --show-error http://localhost:8080/api/health
          curl --fail --silent --show-error http://localhost:8080/api/restaurants | grep -q 'Spice Route'
          curl --fail --silent --show-error http://localhost:8080/restaurants/anything | grep -q '<div id="root">'

      # placing an order runs a MongoDB transaction, which needs the replica set
      - name: Place an order in a demo, through the web container
        run: |
          set -euo pipefail
          api=http://localhost:8080/api
          token=$(curl --fail -s -X POST -H 'Content-Type: application/json' -d '{"as":"customer"}' $api/demo | jq -r .token)
          auth="Authorization: Bearer $token"
          restaurant=$(curl --fail -s -H "$auth" $api/restaurants | jq -r '.[0].id')
          dish=$(curl --fail -s -H "$auth" $api/restaurants/$restaurant/dishes | jq -r '.[0].id')
          curl --fail -s -X POST -H "$auth" -H 'Content-Type: application/json' -d "{\"dishId\":\"$dish\"}" $api/cart/items > /dev/null
          order='{"delivery":{"address":"1 Test Street, Bengaluru","phone":"+91 90000 00000"}}'
          curl --fail -s -X POST -H "$auth" -H 'Content-Type: application/json' -H 'Idempotency-Key: ci-check-order' -d "$order" $api/orders | jq -e '.status == "placed"'

      - name: Show container status and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs

      - name: Stop everything
        if: always()
        run: docker compose down --volumes
